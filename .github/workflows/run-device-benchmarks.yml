name: On Device Benchmarks

on:
  workflow_call:
    inputs:
      strict:
        description: 'Fail the job unless the Smoothness overhead gate passes.'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      device:
        description: 'BrowserStack device, as <model>-<iOS version>. Smoothness overhead sign-off needs a strict run on a 120Hz ProMotion device and one on a 60Hz device.'
        required: false
        type: string
        default: 'iPhone 17 Pro-26'
      strict:
        description: 'Fail the job unless the Smoothness overhead gate passes. Keep on for release sign-off.'
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/run-device-benchmarks.yml'
      - '.github/workflows/browserstack.yml'
      - 'bin/perfcomp.py'
      - 'bin/smoothness_overhead.py'
      - 'Package.swift'
      - 'Sources/**'
      - 'Examples/Benchmarks/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  THRESHOLD_PCT: 5.0
  ALPHA: 0.05
  TITLE: "🚀 Device Benchmarks (PR vs Main)"

jobs:
  browserstack-pr:
    name: Run BrowserStack Tests on PR
    # Dependabot runs get no repository secrets, so the BrowserStack credentials would be empty.
    # Check the PR author, not github.actor: a person re-running the checks becomes the actor.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    uses: ./.github/workflows/browserstack.yml
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    with:
      device: ${{ inputs.device || 'iPhone 17 Pro-26' }}
      # The load calibration sweep runs only from run-smoothness-calibration.yml.
      skip_testing: 'BenchmarksUITests/SmoothnessLoadCalibrationUITests'

  browserstack-main:
    name: Run BrowserStack Tests on Main
    needs: [browserstack-pr]
    if: success()
    uses: ./.github/workflows/browserstack.yml
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    with:
      ref: main
      device: ${{ inputs.device || 'iPhone 17 Pro-26' }}
      skip_testing: 'BenchmarksUITests/SmoothnessLoadCalibrationUITests'

  compare-results:
    name: Compare Performance Results
    needs: [browserstack-pr, browserstack-main]
    runs-on: ubuntu-latest
    if: success()
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install scipy pygithub

      - name: Run Performance Comparison
        # Posts to the PR, so it needs one.
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERF_PR: ${{ needs.browserstack-pr.outputs.results }}
          PERF_MAIN: ${{ needs.browserstack-main.outputs.results }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THRESHOLD_PCT: ${{ env.THRESHOLD_PCT }}
          ALPHA: ${{ env.ALPHA }}
          TITLE: ${{ env.TITLE }}
        run: |
          python bin/perfcomp.py

      - name: Run Smoothness Overhead Comparison
        # Runs after perfcomp so a failure here can't skip the PR-vs-main comparison, and runs even
        # if perfcomp failed. Only a strict (release sign-off) run can fail the job.
        if: ${{ !cancelled() }}
        continue-on-error: ${{ !inputs.strict }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERF_PR: ${{ needs.browserstack-pr.outputs.results }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALPHA: ${{ env.ALPHA }}
          DEVICE: ${{ inputs.device || 'iPhone 17 Pro-26' }}
          # Overrides the workflow-level TITLE, which is also perfcomp's comment marker.
          TITLE: "🎞️ Smoothness Overhead (on vs off)"
          # Blocks on manual (release sign-off) runs; PR runs only report.
          STRICT: ${{ inputs.strict && '1' || '' }}
          # Off arm hitch ratio band (ms/s, "low,high") per device class, from a Smoothness Load
          # Calibration run. Empty leaves the baseline as context only.
          OFF_HITCH_BAND_120: ''
          OFF_HITCH_BAND_60: ''
        run: |
          python bin/smoothness_overhead.py
