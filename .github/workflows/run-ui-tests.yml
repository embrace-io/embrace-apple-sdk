name: UI Tests App

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-ui-tests-app:
    timeout-minutes: 30
    runs-on: [macos-26]
    strategy:
      fail-fast: false
      matrix:
        xcode_version: ["26.5"]
        ios_version: ["26.5"]
        device:
          - "iPhone 17 Pro"
        test_group:
          - name: startup
            filter: "EmbraceIOTestAppUITests/EmbraceIOTestWARMStartupUITests,EmbraceIOTestAppUITests/EmbraceIOTestCOLDStartupUITests"
          - name: logs
            filter: "EmbraceIOTestAppUITests/EmbraceIOTestLogsUITests"
          - name: networking
            filter: "EmbraceIOTestAppUITests/EmbraceIOTestNetworkingUITests"
          - name: session
            filter: "EmbraceIOTestAppUITests/EmbraceIOTestSessionSpanUITests,EmbraceIOTestAppUITests/EmbraceIOTestPostedPayloads"
          - name: views
            filter: "EmbraceIOTestAppUITests/EmbraceIOTestSwiftUI,EmbraceIOTestAppUITests/EmbraceIOTestViewUITests"
    permissions:
      checks: write
    env:
      # Work-around for the plugin dependency being included in the iOS target; see bin/test.
      IS_XCTEST: true

    steps:
      - name: Select Xcode
        # See https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode_version }}.app
          xcodebuild -version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Shutdown Simulators
        run: |
            xcrun simctl shutdown all
      - name: Erase Simulators
        run: |
            xcrun simctl erase all

      - name: Boot Simulator
        id: sim
        env:
          DEVICE: ${{ matrix.device }}
          IOS_VERSION: ${{ matrix.ios_version }}
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
          UDID=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "$RUNTIME" --arg name "$DEVICE" '.devices[$rt][]? | select(.name == $name) | .udid' \
            | head -1)
          if [[ -z "$UDID" ]]; then
            echo "::error::No available '$DEVICE' simulator on $RUNTIME"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Cache SPM Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/artifacts
            .build/*-apple-*/debug/Swift*
            .build/*-apple-*/debug/SourceKit*
            .build/*-apple-*/debug/ArgumentParser*
          key: ${{ runner.os }}-spm-build-cache-test-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-build-cache-test

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build for Testing
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "./Examples/EmbraceIOTestApp/EmbraceIOTestApp.xcodeproj" \
            -scheme "EmbraceIOTestApp" \
            -derivedDataPath "build/DerivedData" \
            -destination "id=$UDID" \
            | xcbeautify --renderer github-actions

      # The first launch of the app on a freshly erased simulator spends about a minute in dyld.
      # Launching it once here moves most of that cost out of the first test; the first test's
      # launch still takes about 30 s, which is why the per-test allowance below is 120 s. The app
      # does not start the Embrace SDK on launch, and it is uninstalled afterwards so the tests
      # get a clean container.
      - name: Warm Up the App
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/EmbraceIOTestApp.app"
          xcrun simctl install "$UDID" "$APP"
          time xcrun simctl launch "$UDID" com.embrace.EmbraceIOTestApp
          sleep 20
          xcrun simctl terminate "$UDID" com.embrace.EmbraceIOTestApp || true
          xcrun simctl uninstall "$UDID" com.embrace.EmbraceIOTestApp

      - name: Run UI Tests (${{ matrix.test_group.name }})
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          TEST_FILTER: ${{ matrix.test_group.filter }}
        run: |
          set -o pipefail
          mkdir -p build
          IFS=',' read -ra FILTERS <<< "$TEST_FILTER"
          xcodebuild test-without-building \
            -project "./Examples/EmbraceIOTestApp/EmbraceIOTestApp.xcodeproj" \
            -scheme "EmbraceIOTestApp" \
            -derivedDataPath "build/DerivedData" \
            -resultBundlePath ".build/test/output" \
            -destination "id=$UDID" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            "${FILTERS[@]/#/-only-testing:}" 2>&1 \
            | tee build/xcodebuild.log \
            | xcbeautify --renderer github-actions

      # xcbeautify can report a test that exceeded its execution time allowance as passed. The
      # result bundle records it as failed, so report failures from there.
      - name: Report Failures from the Result Bundle
        if: always()
        run: |
          BUNDLE=".build/test/output.xcresult"
          if [[ ! -d "$BUNDLE" ]]; then
            echo "No result bundle at $BUNDLE"
            exit 0
          fi
          xcrun xcresulttool get test-results summary --path "$BUNDLE" \
            | jq -r '.testFailures[]? | "::error title=\(.testName)::\(.testIdentifierString) — \(.failureText)"'

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild_log_${{ matrix.test_group.name }}
          path: build/xcodebuild.log

      - name: Upload xcresult Bundle Manually
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output_xcresult_${{ matrix.test_group.name }}
          path: .build/test/output.xcresult
