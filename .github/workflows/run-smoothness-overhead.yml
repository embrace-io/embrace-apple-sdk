name: Smoothness Overhead

# Release sign-off for Smoothness: runs SmoothnessOverheadUITests on one BrowserStack device and fails
# unless bin/smoothness_overhead.py shows the service's overhead is within budget.

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'BrowserStack device, as <model>-<iOS version>. Sign-off needs a passing run on a 120Hz ProMotion device and one on a 60Hz device.'
        required: false
        type: string
        default: 'iPhone 17 Pro-26'

permissions:
  contents: read

# Holds a second run for the same device until the first finishes, so it doesn't queue on BrowserStack
# and time out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.device }}

jobs:
  browserstack:
    name: Run Smoothness Overhead Tests on BrowserStack
    uses: ./.github/workflows/browserstack.yml
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    with:
      device: ${{ inputs.device }}
      only_testing: 'BenchmarksUITests/SmoothnessOverheadUITests'

  report:
    name: Compare Smoothness Overhead
    needs: [browserstack]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install scipy

      - name: Run Smoothness Overhead Comparison
        env:
          PERF_PR: ${{ needs.browserstack.outputs.results }}
          DEVICE: ${{ inputs.device }}
          STRICT: '1'
        run: |
          python bin/smoothness_overhead.py
