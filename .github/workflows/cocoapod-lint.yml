name: Cocoapod Build And Lint

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build-and-lint-cocoapod:
    name: Cocoapod Build And Lint (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The `experimental` toolchain (the next Xcode major, on a preview runner
    # image) reports failures without failing the workflow run.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
          - runner: xcode-27
            xcode: "27.2"
            experimental: true

    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${MATRIX_XCODE}.app"
          xcodebuild -version
        env:
          MATRIX_XCODE: ${{ matrix.xcode }}

      - name: Ensure the Platform is Downloaded
        run: |
          xcodebuild -runFirstLaunch
          xcrun simctl list
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            if [ "$i" -eq 3 ]; then
              echo "::error title=downloadPlatform failed::all 3 attempts failed for iOS"
              exit 1
            fi
            echo "::warning title=downloadPlatform retry::attempt $i failed for iOS; retrying in 15s"
            sleep 15
          done
          xcodebuild -runFirstLaunch

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: 3.2.2

      - name: Install Deps
        run: |
          gem install cocoapods
          gem install xcpretty

      - name: Install Pods
        working-directory: Examples/BrandGame-CocoaPods
        run: pod install

      - name: Build BrandGame-CocoaPods
        uses: ./.github/actions/run-xcodebuild
        with:
          workspace: Examples/BrandGame-CocoaPods/BrandGame.xcworkspace
          scheme: BrandGame
          platform: iOS
          action: build

      - name: Lint Podspec
        id: lint
        shell: bash
        run: |
          set -eo pipefail
          pod lib lint --allow-warnings --verbose --platforms=iOS 2>&1 | tee cocoapod-lint-output.log

      - name: Upload Lint Output on Failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cocoapod-lint-output-xcode${{ matrix.xcode }}
          path: cocoapod-lint-output.log
          retention-days: 2
